# The fast suite: lint + the unit/engine vitest projects (vitest.config.ts).
# No Docker, no secrets: safe to run for every push and PR,
# including fork PRs. The slow scenarios live in e2e.yml.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # test/unit/forward.test.ts builds knecht-forward.
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/knecht-forward/go.mod

      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # typecheck and e2e (dev server, API only) never render a page from the
      # production bundle, so a missing import there only shows up as a 500.
      - name: Render a page from the production build
        run: |
          node .output/server/index.mjs > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          code=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:3000/)
          echo "GET / -> $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then cat server.log; exit 1; fi
