name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the code changes of PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            The diff is `git diff origin/${{ github.base_ref }}...HEAD`.

            Cover the whole diff: list the changed files with `git diff --stat`, then read the diff of
            every changed source file, migration, test and workflow, without truncating it with head or tail.
            Skip only generated files (lockfiles, drizzle `meta/*_snapshot.json`). For large diffs, read it
            file by file. Do not stop until every changed file has been looked at. When a change touches
            code outside the diff (callers, types, stores), read that code too before judging it.

            Look for:
            - Bugs: wrong logic, broken edge cases, missing awaits, race conditions, wrong SQL or migrations,
              data loss, errors that are swallowed, UI state that can get stuck.
            - Regressions: callers or tests that the change breaks, behavior that silently changed.
            - Missing tests for new behavior or a fixed bug.
            - Violations of the rules in CLAUDE.md (em-dashes, comments, commit conventions, simplicity).

            Only report what you are confident is a real problem, and say concretely what goes wrong.
            No style nitpicks, no speculation, nothing a linter or the type checker already catches.

            Report each finding as an inline comment on the affected lines. Before posting, read the existing
            inline comments with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            and do not post a finding that is already there.

            When you are done, write a short summary in Markdown to the file `review-summary.md` in the working
            directory. The step that posts it adds the `## Code review` heading, so do not write a title or any
            `#`/`##` heading yourself. Use exactly this structure and keep each bullet to one line:

                ### Findings
                - <severity>: <what goes wrong> (`path:line`)

                ### Noted, not reported
                - <one line each>

            Write "None." under Findings when there are none, and leave out "Noted, not reported" when it is empty.
            Do not post it yourself, a later step does that.

            CI note: this is a non-interactive run that terminates the moment your turn ends. Do the review
            yourself and do not launch subagents. Finish everything, including the summary file, before ending your turn.
          claude_args: '--model claude-opus-5-5 --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),mcp__github_inline_comment__create_inline_comment"'
          show_full_output: true

      - name: Post or update summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: '<!-- claude-code-review -->'
        run: |
          if [ ! -s review-summary.md ]; then
            echo "::error::Claude did not write review-summary.md, the review did not finish"
            exit 1
          fi
          body="$(printf '%s\n## Code review\n\n' "$MARKER"; cat review-summary.md)"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body"
          else
            gh pr comment "$PR" -R "$REPO" --body "$body"
          fi
