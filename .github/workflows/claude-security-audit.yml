name: Claude Security Audit

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  security-audit:
    if: startsWith(github.head_ref, 'releases/') && github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install security-audit skill
        run: |
          git clone https://github.com/cloudflare/security-audit-skill.git /tmp/security-audit-skill
          git -C /tmp/security-audit-skill checkout c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
          mkdir -p ~/.claude/skills
          cp -r /tmp/security-audit-skill/skills/security-audit ~/.claude/skills/

      - name: Run Claude Security Audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /security-audit Focused review (guidance mode, no report files) of the diff
            `git diff origin/${{ github.base_ref }}...HEAD` in PR
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Only report confirmed findings, as inline comments on the affected lines.

            CI note: this is a non-interactive run that terminates the moment your turn ends. Never launch background agents. Run every agent synchronously (run_in_background: false) and finish the entire review, including posting comments, before ending your turn.
          claude_args: '--allowedTools "Skill,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"'
          show_full_output: true
