name: Claude Security Audit

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  security-audit:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install security-audit skill
        run: |
          git clone https://github.com/cloudflare/security-audit-skill.git /tmp/security-audit-skill
          git -C /tmp/security-audit-skill checkout c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
          mkdir -p ~/.claude/skills
          cp -r /tmp/security-audit-skill/skills/security-audit ~/.claude/skills/

      - name: Run Claude Security Audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Load the security-audit skill with the Skill tool first, then run a focused review
            (guidance mode, no report files) of the diff `git diff origin/${{ github.base_ref }}...HEAD`
            in PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            Cover the whole diff: list the changed files with `git diff --stat`, then read the diff of
            every changed source file, migration and workflow, without truncating it with head or tail.
            Do not stop until every changed file has been looked at.

            Report each confirmed finding as an inline comment on the affected lines. Before posting, read the existing
            inline comments with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            and do not post a finding that is already there.

            When you are done, write a short summary in Markdown to the file `audit-summary.md` in the working
            directory. The step that posts it adds the `## Security review` heading, so do not write a title or any
            `#`/`##` heading yourself. Use exactly this structure and keep each bullet to one line:

                ### Findings
                - <severity>: <what goes wrong> (`path:line`)

                ### Noted, not reported
                - <one line each>

            Write "None." under Findings when there are none, and leave out "Noted, not reported" when it is empty.
            Do not post it yourself, a later step does that.

            CI note: this is a non-interactive run that terminates the moment your turn ends. Never launch background agents. Run every agent synchronously (run_in_background: false) and finish the entire review, including the summary file, before ending your turn.
          claude_args: '--allowedTools "Skill,Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),mcp__github_inline_comment__create_inline_comment"'
          show_full_output: true

      - name: Post or update summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: '<!-- claude-security-audit -->'
        run: |
          if [ ! -s audit-summary.md ]; then
            echo "::error::Claude did not write audit-summary.md, the audit did not finish"
            exit 1
          fi
          body="$(printf '%s\n## Security review\n\n' "$MARKER"; cat audit-summary.md)"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body"
          else
            gh pr comment "$PR" -R "$REPO" --body "$body"
          fi
