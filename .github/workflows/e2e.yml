# The slow suite: real HTTP scenarios against a running instance
# (test/e2e/**, vitest.e2e.config.ts). Deliberately NOT on every push: it
# runs for PRs targeting main or a release branch, and on manual dispatch, so
# the expensive checks are an explicit gesture (open a PR) instead of a tax on
# every commit. PRs into a release branch get the same checks; the main
# ruleset requires the single `e2e` check at the end of this file.
#
# The repo is PUBLIC: nothing here may execute for fork PRs. The job-level
# guard skips them (their pull_request runs get no secrets anyway, but the
# guard makes that an explicit skip instead of a confusing failure, and it
# stays load-bearing if a self-hosted runner ever picks these jobs up).
name: e2e

on:
  pull_request:
    branches: [main, "releases/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # A PAT with no scopes (identity lookup only): the dev login resolves the
      # session identity from it, mirroring the OAuth callback.
      KNECHT_TEST_GITHUB_TOKEN: ${{ secrets.KNECHT_TEST_GITHUB_TOKEN }}
      KNECHT_BASE_URL: http://lvh.me:3333
      # Allow-lists .lvh.me in the dev server's host check (nuxt.config.ts
      # vite.server.allowedHosts); without it every probe gets a 403.
      KNECHT_BASE_DOMAIN: lvh.me
    steps:
      - uses: actions/checkout@v4

      - name: Require the e2e secret
        run: |
          if [ -z "$KNECHT_TEST_GITHUB_TOKEN" ]; then
            echo "::error::Set the KNECHT_TEST_GITHUB_TOKEN repo secret (a no-scope PAT) to run the e2e suite."
            exit 1
          fi

      - name: Start the dev container
        run: bash scripts/ci-dev-server.sh

      # The boot e2e needs the ddev substrate and runs in its own job below.
      - run: bash scripts/dev-compose.sh exec -T -e KNECHT_E2E_BASE_URL=http://lvh.me:3333 knecht npm run test:e2e -- --exclude test/e2e/boot.test.ts

      # failure() alone would skip this when the job dies of timeout-minutes
      # (that surfaces as a cancellation), the case that needs the log most.
      - name: Dump the server log on failure
        if: failure() || cancelled()
        run: bash scripts/dev-compose.sh logs --tail 200 knecht

  # The boot e2e: provision the runner as a real Knecht substrate
  # (provision-host.sh, the same script the VPS and the dev VM run), start the
  # PR's code as a dev server and let the boot test connect the fixture repo,
  # boot it with the suite's own bare boot workflow and hit the preview origins.
  # One matrix job per fixture repo (test/e2e/boot.test.ts FIXTURES, selected
  # via KNECHT_E2E_FIXTURE): the boots run in parallel on their own runners,
  # and a failing CMS names itself in the check list.
  boot-fixture:
    name: boot (${{ matrix.fixture }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fixture: [php, craftcms, kirby, drupal10, drupal11, laravel, typo3, no-ddev]
    # Provisioning plus one boot (composer install and a vite build for the
    # CMS fixtures) fits comfortably; a wedged boot still dies.
    timeout-minutes: 30
    env:
      KNECHT_E2E_FIXTURE: knecht-works/test-${{ matrix.fixture }}
      KNECHT_TEST_GITHUB_TOKEN: ${{ secrets.KNECHT_TEST_GITHUB_TOKEN }}
      # A GitHub App (id + PEM private key) installed on the fixture repo; the
      # dev server picks it up via the dev-only read fallback in
      # server/utils/github-credentials.ts.
      KNECHT_TEST_GITHUB_APP_ID: ${{ secrets.KNECHT_TEST_GITHUB_APP_ID }}
      KNECHT_TEST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.KNECHT_TEST_GITHUB_APP_PRIVATE_KEY }}
      KNECHT_BASE_URL: http://lvh.me:3333
      KNECHT_BASE_DOMAIN: lvh.me
    steps:
      - uses: actions/checkout@v4

      - name: Require the boot e2e secrets
        run: |
          for v in KNECHT_TEST_GITHUB_TOKEN KNECHT_TEST_GITHUB_APP_ID KNECHT_TEST_GITHUB_APP_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Set the $v repo secret to run the boot e2e."
              exit 1
            fi
          done

      # Docker (the runner's own works fine now: no pin, no special runtime)
      # and the projects dir. Same path as the VPS and the dev VM.
      - name: Provision the substrate
        run: |
          ./scripts/provision-host.sh
          sudo chmod 666 /var/run/docker.sock
          docker info > /dev/null

      - name: Start the dev container
        run: bash scripts/ci-dev-server.sh

      - run: bash scripts/dev-compose.sh exec -T -e KNECHT_E2E_BASE_URL=http://lvh.me:3333 -e KNECHT_E2E_FIXTURE="$KNECHT_E2E_FIXTURE" knecht npm run test:e2e -- boot

      # failure() alone would skip this when the job dies of timeout-minutes
      # (that surfaces as a cancellation), the likeliest way a sandbox boot
      # wedges and exactly when these dumps matter.
      - name: Dump diagnostics on failure
        if: failure() || cancelled()
        run: |
          echo "--- dev log:"
          bash scripts/dev-compose.sh logs --tail 300 knecht || true
          echo "--- containers:"
          docker ps -a || true
          for c in $(docker ps -aq --filter label=knecht.run); do
            echo "--- sandbox $c:"
            docker logs "$c" 2>&1 | tail -50 || true
          done

  # Green only when every fixture boot passed, so `e2e` below needs one job.
  # `always()` so a failed matrix job reaches it (a failed dependency would
  # otherwise skip it, and a skipped check passes); the fork guard keeps it
  # skipped where the matrix itself was.
  boot:
    needs: boot-fixture
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.boot-fixture.result }}" != "success" ]; then
            echo "::error::A fixture boot failed (${{ needs.boot-fixture.result }})."
            exit 1
          fi

  # The single check the main ruleset requires: green only when api and every
  # fixture boot passed. Same `always()` and fork guard as boot above.
  e2e:
    needs: [api, boot]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.api.result }}" != "success" ] || [ "${{ needs.boot.result }}" != "success" ]; then
            echo "::error::e2e failed (api: ${{ needs.api.result }}, boot: ${{ needs.boot.result }})."
            exit 1
          fi
