# The install smoke (scripts/ci-install-smoke.sh) on a fresh Ubuntu 24.04
# runner: install the way a new user does, update to an image built from this
# commit, and assert that the app runs and boots a ddev project.
#
# The `latest-release` leg starts at the newest stable release instead, with
# its own installer, so instances on it are proven to survive the update.
#
# Runs on amd64 AND arm64 (the two supported host architectures). Note: the
# smoke installs with KNECHT_REF=<sha>, which pins the `latest` image, so the
# arm64 leg only passes once a stable release has published a multi-arch
# `latest` (true since v0.3.0); before that it fails at `docker compose pull`.
name: install

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-leg:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        from: [this, latest-release]
    name: install (${{ matrix.runner }}, from ${{ matrix.from }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # On pull_request events GITHUB_SHA is the ephemeral merge commit
      # (refs/pull/N/merge), which install.sh's plain clone cannot check out.
      # Use the PR head SHA there; it lives on a pushed branch.
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The runner ships Docker preinstalled; a fresh VPS has none. Purge it so
      # the installer runs the real fresh-server path.
      - name: Remove the preinstalled Docker (simulate a fresh server)
        run: |
          sudo systemctl stop docker.socket docker 2>/dev/null || true
          sudo apt-get purge -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras 2>/dev/null || true
          sudo rm -rf /etc/docker /var/lib/docker
          # The runner image keeps a leftover 'packer' user on uid 1000; the
          # installer reserves that uid for 'knecht' (free on fresh servers).
          sudo userdel packer 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Install, update and assert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FROM_REF="$REF"
          if [ "${{ matrix.from }}" = latest-release ]; then
            FROM_REF=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            echo "Starting from $FROM_REF"
          fi
          sudo bash scripts/ci-install-smoke.sh "$GITHUB_REPOSITORY" "$REF" "$FROM_REF"

  # The single "install" check the main ruleset requires, so the matrix can
  # change without touching the ruleset. `always()` so a failed leg reaches it
  # (a failed dependency would otherwise skip it, and a skipped check passes).
  install:
    needs: install-leg
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.install-leg.result }}" != "success" ]; then
            echo "::error::An install leg failed (${{ needs.install-leg.result }})."
            exit 1
          fi
